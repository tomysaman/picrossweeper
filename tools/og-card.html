<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picrossweeper social card</title>
<!-- Source for og-image.png. Render at a 1200x630 viewport and screenshot the page. -->
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #2b2620; color: #f1e7d0;
    font: 16px/1.4 Georgia, "Times New Roman", serif;
    display: flex; align-items: center;
  }
  .text { flex: 1; padding: 0 40px 0 80px; }
  h1 { margin: 0; font-size: 76px; font-weight: normal; letter-spacing: 3px; color: #d9a441; }
  .tagline { margin: 18px 0 0; font-size: 32px; color: #f1e7d0; }
  .sub { margin: 28px 0 0; font-size: 22px; color: #b9ad94; }
  .board {
    width: 520px; height: 520px; margin-right: 55px; flex: none;
    border-radius: 14px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .board img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="text">
    <h1>Picrossweeper</h1>
    <p class="tagline">A picross × minesweeper puzzle.<br>Solve the grid, uncover the picture.</p>
    <p class="sub">Free in your browser · no guessing, pure logic</p>
  </div>
  <div class="board"><img src="../shots/board-mid.png" alt=""></div>
</body>
</html>
